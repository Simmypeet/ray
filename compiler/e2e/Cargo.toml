[package]
name = "rayc_e2e"
description = "end-to-end tests for Ray compiler"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false


[dev-dependencies]
tempfile = { workspace = true }
insta = { workspace = true }
rayc_driver = { path = "../driver" }
rayc_target = { path = "../base/target/" }
clap = { workspace = true }
termcolor = { workspace = true }
tokio = { workspace = true, features = ["io-util", "time"] }
test-generator = { workspace = true }
pretty_assertions = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tracing-subscriber = { workspace = true }
stacker = { workspace = true }
ray_lsp = { path = "../../lsp/server" }
tower-lsp = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "check_e2e"
path = "test/check/mod.rs"

[[test]]
name = "run_e2e"
path = "test/run/mod.rs"

[[test]]
name = "project_e2e"
path = "test/project/mod.rs"

[[test]]
name = "new_e2e"
path = "test/new/mod.rs"

[[test]]
name = "completion_e2e"
path = "test/completion/mod.rs"

[lints]
workspace = true
