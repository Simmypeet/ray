[env]
RAYC_CARGO_WORKSPACE_DIR = { value = "", relative = true }

# The flag -Zhigher-ranked-assumptions is needed to work around the false 
# positive in borrow-checker when working with async trait and GATs. 
# If this issue is fixed in Rust, this flag can be removed 
# https://github.com/rust-lang/rust/pull/143545
[target.'cfg(all())']
rustflags = ["-Zhigher-ranked-assumptions"]

# Resolve features once for the whole workspace, so `cargo test -p X`,
# workspace builds, and rust-analyzer share the same dependency builds
# instead of each producing its own copy in `target/`.
[unstable]
feature-unification = true

[resolver]
feature-unification = "workspace"
