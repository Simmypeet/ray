name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep the other platforms running when one fails, so platform-specific
      # breakage (e.g. how `cc` is invoked) is reported for every OS at once.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # Snapshot and test inputs are compared byte-for-byte; keep LF endings.
      - name: Disable CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The driver and codegen tests invoke `cc` directly. Linux and macOS
      # runners provide it; on Windows expose the preinstalled MinGW gcc as
      # `cc` so the same code path is exercised.
      - name: Provide `cc` on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw --no-progress -y
            $env:PATH = "C:\ProgramData\mingw64\mingw64\bin;$env:PATH"
          }
          $gccDir = Split-Path (Get-Command gcc).Source
          Copy-Item (Join-Path $gccDir "gcc.exe") (Join-Path $gccDir "cc.exe") -Force
          $gccDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # bindgen (used by the RocksDB bindings) needs libclang.
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Show C compiler
        run: cc --version

      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast
